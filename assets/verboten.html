<!DOCTYPE html>
<!-- Generated using Gemini Canvas at https://gemini.google.com/ -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verboten Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
        .perspective-container {
            perspective: 1000px;
        }
        .card {
            transform-style: preserve-3d;
            transition: transform 0.6s;
        }
        .card.flipped {
            transform: rotateY(180deg);
        }
        .card-face {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .card-back {
            transform: rotateY(180deg);
        }

        @keyframes grow {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        .animate-grow {
            animation: grow 0.5s cubic-bezier(0.250, 0.460, 0.450, 0.940) both;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }
        .mic-active {
            animation: pulse 1.5s infinite;
            box-shadow: 0 0 0 0 rgba(239, 68, 68, 1);
            animation: pulse-red 2s infinite;
        }
        @keyframes pulse-red {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            }
            70% {
                transform: scale(1);
                box-shadow: 0 0 0 10px rgba(239, 68, 68, 0);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
            }
        }

        #referee-img {
            z-index: 5;  /* above the game box */
        }
        #contestant2-img {
            z-index: -1;  /* below the game box */
        }
        .red-cross {
            width: 20px;
            height: 4px;
            background-color: red;
            position: relative;
            transform: rotate(45deg);
            margin: 10px;
        }

        .red-cross::after {
            content: "";
            position: absolute;
            width: 20px;
            height: 4px;
            background-color: red;
            transform: rotate(90deg);
        }
    </style>


    <script>

        var audioDebug;

            var inputDiv;
            var ws;
            var isRecording = false;
            var audioChunksReceived = [];
            var audioChunksSent = [];
            var processor; // Audio processor.
            var captureAudioContext;
            var mediaStream;
            var inputTimer; // Timer for input button.
            var humanSpeech = '';
            var modelSpeech = '';
            var gameEnded = false;
            var winTimeout = null;
            var preludeTimer = null;

            var inputSampleRate = 16000;
            var outputSampleRate = 24000;

            var playbackContext = null;
            var playbackGain = null;
            var refereeGain = null;
            var nextPlaybackTime = 0;
            var activeAudioSources = [];
            var activeRefereeSource = null;
            var activeRefereeAnim = null;
            var refereeAudioEl = null;
            var activeRefereeBlobUrl = null;
            var refereePlaybackRate = 1.18;

            function encodeAudio(audioChunks, sampleRate, bitDepth, numChannels) {
                var audioData = mergeUint8Array(audioChunks);

                const dataSize = audioData.length;
                const fileSize = dataSize + 36;
                const blockAlign = numChannels * bitDepth / 8;
                const byteRate = sampleRate * blockAlign;

                const buffer = new ArrayBuffer(44);
                const view = new DataView(buffer);

                function writeString(offset, string) {
                    for (let i = 0; i < string.length; i++) {
                        view.setUint8(offset + i, string.charCodeAt(i));
                    }
                }

                writeString(0, 'RIFF');
                view.setUint32(4, fileSize, true);
                writeString(8, 'WAVE');
                writeString(12, 'fmt ');
                view.setUint32(16, 16, true);
                view.setUint16(20, 1, true);
                view.setUint16(22, numChannels, true);
                view.setUint32(24, sampleRate, true);
                view.setUint32(28, byteRate, true);
                view.setUint16(32, blockAlign, true);
                view.setUint16(34, bitDepth, true);
                writeString(36, 'data');
                view.setUint32(40, dataSize, true);

                let mergedData = mergeUint8Array([new Uint8Array(buffer), audioData]);

                return new Blob([mergedData.buffer], { type: 'audio/wav' });
            }

            function createContent(msg) {
                data = { 'clientContent': { 'turnComplete': true, 'turns': [{ 'parts': [{ 'text': msg }] }] } };
                return JSON.stringify(data);
            }

            function createImageContent(msg) {
                data = { 'media': { 'data': msg,  'mimeType': 'image/jpeg'  } };
                return JSON.stringify(data);
            }

            function createAudioContent(msg, rate) {
                data = { 'audio': { 'data': msg, 'mimeType': `audio/pcm;rate=${rate || inputSampleRate}` } };
                return JSON.stringify(data);
            }

            function mergeUint8Array(arrays) {
                const totalSize = arrays.reduce((acc, e) => acc + e.length, 0);
                const merged = new Uint8Array(totalSize);

                arrays.forEach((array, i, arrays) => {
                    const offset = arrays.slice(0, i).reduce((acc, e) => acc + e.length, 0);
                    merged.set(array, offset);
                });

                return merged;
            }

            function b64ToUint8Array(b64Data, contentType = '', sliceSize = 512) {
                const byteCharacters = atob(b64Data);
                const byteArrays = [];

                for (let offset = 0; offset < byteCharacters.length; offset += sliceSize) {
                    const slice = byteCharacters.slice(offset, offset + sliceSize);

                    const byteNumbers = new Array(slice.length);
                    for (let i = 0; i < slice.length; i++) {
                        byteNumbers[i] = slice.charCodeAt(i);
                    }
                    const byteArray = new Uint8Array(byteNumbers);
                    byteArrays.push(byteArray);
                }

                var res = mergeUint8Array(byteArrays);
                return res;
            }

            function openWs(lang) {
                if (ws) {
                    return false;
                }
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const params = new URLSearchParams();
                params.set('target', targetWord.word);
                for (const word of allForbiddenWords) {
                    params.append('forbidden', word);
                }
                ws = new WebSocket(`${protocol}//${window.location.host}/live/${lang}?${params.toString()}`);
                ws.onopen = function (evt) {
                    console.debug('OPEN');
                }
                ws.onclose = function (evt) {
                    console.debug('CLOSE');
                    ws = null;
                }
                ws.onmessage = function (evt) {
                    data = JSON.parse(evt.data);
                    if (data.judge && data.judge.lost) {
                        console.log('Judge declared loss:', data.judge);
                        const lossMessage = data.judge.message || formatJudgeLossMessage(data.judge.spokenWord, data.judge.forbiddenWord, data.judge.reason);
                        const judgeAudio = data.judge.audio ? {
                            data: data.judge.audio,
                            mimeType: data.judge.audioMimeType || 'audio/wav'
                        } : null;
                        endGame(false, lossMessage, judgeAudio);
                        return;
                    }
                    if (!data.serverContent) return;

                    if (data.serverContent.inputTranscription && data.serverContent.inputTranscription.text) {
                        humanSpeech += data.serverContent.inputTranscription.text + " ";
                        console.log('Human says: ', humanSpeech);
                    }
                    const lastModelText = data?.serverContent?.outputTranscription?.text;
                    if (data.serverContent.outputTranscription && lastModelText) {
                        console.log('Model says: ', lastModelText);
                        modelSpeech += lastModelText;
                        if (!winTimeout && modelSpeech.toLowerCase().includes(targetWord.word.toLowerCase())) {
                            // Give 1200ms for the contestant to actually pronounce the word, then
                            // proclaim victory (prefetching the Gemini TTS win phrase in parallel).
                            const winClipPromise = fetchRefereeTTS(phrases[currentLanguage].goodJob, currentLanguage);
                            winTimeout = setTimeout(async () => {
                                const winClip = await winClipPromise;
                                if (!gameEnded) {
                                    endGame(true, phrases[currentLanguage].modelGuessedWord(targetWord.word), winClip);
                                }
                            }, 1200);
                            return;
                        } else {
                            // Missed :(
                            console.log(`Model missed, "${lastModelText}" is not the word.`);
                        }
                    }

                    if (data.serverContent.turnComplete) {
                        if (audioChunksSent.length > 0) {
                            //console.log(audioChunksSent.length);
                            audioChunksSent = [];
                        }
                        audioChunksReceived = []
                        return;
                    }
                    if (!data.serverContent.modelTurn || !data.serverContent.modelTurn.parts) return;
                    for (const part of data.serverContent.modelTurn.parts) {
                        if (part && part.inlineData && part.inlineData.mimeType && part.inlineData.mimeType.startsWith('audio/pcm')) {
                            const audioData = b64ToUint8Array(part.inlineData.data);
                            const rate = parseSampleRate(part.inlineData.mimeType, outputSampleRate);
                            audioChunksReceived.push(audioData);
                            schedulePCMPlayback(audioData, rate);
                        }
                    }
                }
                ws.onerror = function (evt) {
                    console.error('ERROR: ' + evt.data);
                }
                return false;
            };

            function isHeadphonesMode() {
                const toggle = document.getElementById('headphones-mode');
                return toggle ? toggle.checked : false;
            }

            function getAudioConstraints() {
                if (isHeadphonesMode()) {
                    return {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false,
                    };
                }
                return {
                    echoCancellation: true,
                    noiseSuppression: true,
                    autoGainControl: false,
                };
            }

            function recordStop() {
                if (processor) {
                    processor.disconnect(); // Disconnect processor
                    processor = null;
                }
                if (captureAudioContext) {
                    captureAudioContext.close().catch(() => {});
                    captureAudioContext = null;
                }
                if (mediaStream) {
                    mediaStream.getTracks().forEach(track => track.stop());
                    mediaStream = null;
                }
                isRecording = false;
            }

            function recordStart() {
                recordAudio();
                isRecording = true;
            }

            function recordAudio() {
                console.debug('recordAudio()');
                navigator.mediaDevices.getUserMedia({ audio: getAudioConstraints() }).then(stream => {
                    mediaStream = stream;
                    captureAudioContext = new AudioContext({ sampleRate: inputSampleRate });
                    const actualRate = captureAudioContext.sampleRate;
                    const source = captureAudioContext.createMediaStreamSource(stream);
                    processor = captureAudioContext.createScriptProcessor(1024, 1, 1); // bufferSize, numInputChannels, numOutputChannels
                    const silentGain = captureAudioContext.createGain();
                    silentGain.gain.value = 0;

                    processor.onaudioprocess = (e) => {
                        const inputData = e.inputBuffer.getChannelData(0); // Raw PCM data
                        const pcmData16 = convertFloat32ToInt16(inputData);

                        // Process or send pcmData16 via WebSocket
                        if (ws && ws.readyState === WebSocket.OPEN && preludeFinished) {
                            // console.debug('audioChunksSent.push()');
                            audioChunksSent.push(new Uint8Array(pcmData16.buffer))
                            const base64Data = arrayBufferToBase64(pcmData16.buffer);
                            ws.send(createAudioContent(base64Data, actualRate));
                        }
                    };

                    source.connect(processor);
                    processor.connect(silentGain);
                    silentGain.connect(captureAudioContext.destination);
                });
            }


            function arrayBufferToBase64(buffer) {
                let binary = '';
                const bytes = new Uint8Array(buffer);
                const len = bytes.byteLength;
                for (let i = 0; i < len; i++) {
                    binary += String.fromCharCode(bytes[i]);
                }
                return btoa(binary);
            }

            function convertFloat32ToInt16(float32Array) {
                const int16Array = new Int16Array(float32Array.length);
                for (let i = 0; i < float32Array.length; i++) {
                    int16Array[i] = Math.max(-32768, Math.min(32767, float32Array[i] * 32768)); // Scale and clamp
                }
                return int16Array;
            }

            function parseSampleRate(mimeType, fallbackRate) {
                if (!mimeType) return fallbackRate;
                const match = /rate=(\d+)/i.exec(mimeType);
                if (match) {
                    const parsed = parseInt(match[1], 10);
                    if (parsed > 0) return parsed;
                }
                return fallbackRate;
            }

            function ensurePlaybackContext() {
                if (!playbackContext) {
                    playbackContext = new AudioContext({ sampleRate: outputSampleRate });
                    playbackGain = playbackContext.createGain();
                    playbackGain.gain.value = 0.55; // Moderate gain to reduce speaker-to-mic AEC ducking
                    playbackGain.connect(playbackContext.destination);
                    refereeGain = playbackContext.createGain();
                    refereeGain.gain.value = 1.0;
                    refereeGain.connect(playbackContext.destination);
                    nextPlaybackTime = 0;
                }
                if (playbackContext.state === 'suspended') {
                    playbackContext.resume();
                }
                return playbackContext;
            }

            function schedulePCMPlayback(pcmBytes, sampleRateHz) {
                if (!pcmBytes || pcmBytes.byteLength < 2) {
                    return;
                }
                const ctx = ensurePlaybackContext();
                const sampleCount = Math.floor(pcmBytes.byteLength / 2);
                const view = new DataView(pcmBytes.buffer, pcmBytes.byteOffset, sampleCount * 2);
                const floatSamples = new Float32Array(sampleCount);
                for (let i = 0; i < sampleCount; i++) {
                    floatSamples[i] = view.getInt16(i * 2, true) / 32768;
                }
                const audioBuffer = ctx.createBuffer(1, sampleCount, sampleRateHz);
                audioBuffer.getChannelData(0).set(floatSamples);

                const src = ctx.createBufferSource();
                src.buffer = audioBuffer;
                src.connect(playbackGain);

                const now = ctx.currentTime;
                const startAt = Math.max(now + 0.02, nextPlaybackTime);
                nextPlaybackTime = startAt + audioBuffer.duration;
                activeAudioSources.push(src);
                src.onended = () => {
                    const idx = activeAudioSources.indexOf(src);
                    if (idx !== -1) activeAudioSources.splice(idx, 1);
                };
                contestantSpeaking();
                src.start(startAt);
            }

            function stopPlayback() {
                for (const src of activeAudioSources) {
                    try {
                        src.stop();
                    } catch (e) {}
                }
                activeAudioSources = [];
                nextPlaybackTime = 0;
            }

            function ensureRefereeAudioElement() {
                if (!refereeAudioEl) {
                    refereeAudioEl = new Audio();
                    refereeAudioEl.preload = 'auto';
                }
                refereeAudioEl.preservesPitch = true;
                refereeAudioEl.mozPreservesPitch = true;
                refereeAudioEl.webkitPreservesPitch = true;
                refereeAudioEl.defaultPlaybackRate = refereePlaybackRate;
                refereeAudioEl.playbackRate = refereePlaybackRate;
                return refereeAudioEl;
            }

            function unlockRefereeAudio() {
                const el = ensureRefereeAudioElement();
                try {
                    const silentBlob = encodeAudio([new Uint8Array(64)], outputSampleRate, 16, 1);
                    const url = URL.createObjectURL(silentBlob);
                    el.src = url;
                    const p = el.play();
                    if (p && typeof p.then === 'function') {
                        p.then(() => {
                            if (el.src === url) {
                                el.pause();
                            }
                            URL.revokeObjectURL(url);
                        }).catch(() => {
                            URL.revokeObjectURL(url);
                        });
                    } else {
                        URL.revokeObjectURL(url);
                    }
                } catch (e) {}
            }

            function audioBufferToWavBlob(audioBuffer) {
                const channelData = audioBuffer.getChannelData(0);
                const int16 = convertFloat32ToInt16(channelData);
                return encodeAudio([new Uint8Array(int16.buffer)], audioBuffer.sampleRate, 16, 1);
            }

            function stopRefereePlayback() {
                if (refereeAudioEl) {
                    refereeAudioEl.onended = null;
                    refereeAudioEl.onerror = null;
                    try {
                        refereeAudioEl.pause();
                        refereeAudioEl.currentTime = 0;
                    } catch (e) {}
                }
                if (activeRefereeBlobUrl) {
                    URL.revokeObjectURL(activeRefereeBlobUrl);
                    activeRefereeBlobUrl = null;
                }
                if (activeRefereeSource) {
                    const prev = activeRefereeSource;
                    activeRefereeSource = null;
                    prev.onended = null;
                    try {
                        prev.stop();
                    } catch (e) {}
                }
                if (activeRefereeAnim) {
                    clearInterval(activeRefereeAnim);
                    activeRefereeAnim = null;
                }
                if (window.speechSynthesis) {
                    try {
                        window.speechSynthesis.cancel();
                    } catch (e) {}
                }
                const refereeImg = document.getElementById('referee-img');
                if (refereeImg) {
                    refereeImg.src = '/forbiddenwords/referee.png';
                }
            }

            async function decodeRefereeAudioBuffer(ctx, uint8Bytes, mimeType) {
                const lowerMime = (mimeType || '').toLowerCase();
                if (lowerMime.startsWith('audio/pcm') || lowerMime.startsWith('audio/l16')) {
                    const sampleRateHz = parseSampleRate(mimeType, outputSampleRate);
                    const sampleCount = Math.floor(uint8Bytes.byteLength / 2);
                    const view = new DataView(uint8Bytes.buffer, uint8Bytes.byteOffset, sampleCount * 2);
                    const floatSamples = new Float32Array(sampleCount);
                    for (let i = 0; i < sampleCount; i++) {
                        floatSamples[i] = view.getInt16(i * 2, true) / 32768;
                    }
                    const audioBuffer = ctx.createBuffer(1, sampleCount, sampleRateHz);
                    audioBuffer.getChannelData(0).set(floatSamples);
                    return audioBuffer;
                }
                const copy = uint8Bytes.buffer.slice(uint8Bytes.byteOffset, uint8Bytes.byteOffset + uint8Bytes.byteLength);
                return await ctx.decodeAudioData(copy);
            }

            function trimAudioBufferSilence(ctx, buffer) {
                const data = buffer.getChannelData(0);
                const threshold = 0.01;
                let start = 0;
                while (start < data.length && Math.abs(data[start]) < threshold) {
                    start++;
                }
                if (start >= data.length) {
                    return buffer;
                }
                let end = data.length - 1;
                while (end > start && Math.abs(data[end]) < threshold) {
                    end--;
                }
                const leadPad = Math.floor(buffer.sampleRate * 0.025);
                const tailPad = Math.floor(buffer.sampleRate * 0.045);
                start = Math.max(0, start - leadPad);
                end = Math.min(data.length, end + 1 + tailPad);
                const trimmedLen = end - start;
                if (trimmedLen <= 0 || trimmedLen >= data.length) {
                    return buffer;
                }
                const trimmed = ctx.createBuffer(buffer.numberOfChannels, trimmedLen, buffer.sampleRate);
                for (let ch = 0; ch < buffer.numberOfChannels; ch++) {
                    trimmed.getChannelData(ch).set(buffer.getChannelData(ch).subarray(start, end));
                }
                return trimmed;
            }

            async function playRefereeAudioBytes(uint8Bytes, mimeType, waving) {
                const ctx = ensurePlaybackContext();
                if (ctx.state === 'suspended') {
                    await ctx.resume().catch(() => {});
                }
                const decodedBuffer = await decodeRefereeAudioBuffer(ctx, uint8Bytes, mimeType);
                const audioBuffer = trimAudioBufferSilence(ctx, decodedBuffer);
                stopRefereePlayback();

                const anim = refereeSpeaking(waving);
                activeRefereeAnim = anim;

                const finishAnim = () => {
                    if (activeRefereeAnim === anim) {
                        clearInterval(anim);
                        activeRefereeAnim = null;
                    }
                    const refereeImg = document.getElementById('referee-img');
                    if (refereeImg) {
                        refereeImg.src = waving ? '/forbiddenwords/referee_waves.png' : '/forbiddenwords/referee.png';
                    }
                };

                // Prefer HTMLAudioElement with preservesPitch=true for natural speedup without pitch shift.
                try {
                    const el = ensureRefereeAudioElement();
                    const wavBlob = audioBufferToWavBlob(audioBuffer);
                    const blobUrl = URL.createObjectURL(wavBlob);
                    activeRefereeBlobUrl = blobUrl;
                    el.src = blobUrl;
                    el.preservesPitch = true;
                    el.mozPreservesPitch = true;
                    el.webkitPreservesPitch = true;
                    el.playbackRate = refereePlaybackRate;

                    await new Promise((resolve, reject) => {
                        const cleanup = () => {
                            el.onended = null;
                            el.onerror = null;
                            if (activeRefereeBlobUrl === blobUrl) {
                                URL.revokeObjectURL(blobUrl);
                                activeRefereeBlobUrl = null;
                            }
                            finishAnim();
                        };
                        el.onended = () => {
                            cleanup();
                            resolve();
                        };
                        el.onerror = (err) => {
                            cleanup();
                            reject(err);
                        };
                        const playPromise = el.play();
                        if (playPromise && typeof playPromise.catch === 'function') {
                            playPromise.catch((err) => {
                                cleanup();
                                reject(err);
                            });
                        }
                    });
                    return;
                } catch (err) {
                    console.warn('HTMLAudioElement referee playback fallback to AudioContext:', err);
                }

                // Fallback to unlocked Web Audio AudioContext if HTMLAudioElement playback is blocked.
                const fallbackAnim = refereeSpeaking(waving);
                activeRefereeAnim = fallbackAnim;
                return new Promise((resolve) => {
                    const src = ctx.createBufferSource();
                    src.buffer = audioBuffer;
                    src.connect(refereeGain || ctx.destination);
                    activeRefereeSource = src;
                    src.onended = () => {
                        if (activeRefereeSource === src) {
                            activeRefereeSource = null;
                        }
                        if (activeRefereeAnim === fallbackAnim) {
                            clearInterval(fallbackAnim);
                            activeRefereeAnim = null;
                        }
                        const refereeImg = document.getElementById('referee-img');
                        if (refereeImg) {
                            refereeImg.src = waving ? '/forbiddenwords/referee_waves.png' : '/forbiddenwords/referee.png';
                        }
                        resolve();
                    };
                    src.start(0);
                });
            }

            async function fetchRefereeTTS(text, lang) {
                try {
                    const resp = await fetch('/tts', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ lang: lang || currentLanguage, text: text })
                    });
                    if (!resp.ok) {
                        console.warn('Gemini TTS request failed:', resp.status);
                        return null;
                    }
                    const mimeType = resp.headers.get('Content-Type') || 'audio/wav';
                    const buf = await resp.arrayBuffer();
                    if (!buf || buf.byteLength === 0) {
                        return null;
                    }
                    return { bytes: new Uint8Array(buf), mimeType };
                } catch (err) {
                    console.warn('Gemini TTS fetch error:', err);
                    return null;
                }
            }

            function refereeSpeaking(waving) {
                const refereeImg = document.getElementById('referee-img');
                let originalSrc = '/forbiddenwords/referee.png';
                let speakingSrc = '/forbiddenwords/referee_openmouth.png';
                if(waving) {
                    originalSrc = '/forbiddenwords/referee_waves.png';
                    speakingSrc = '/forbiddenwords/referee_waves_openmouth.png';
                }

                if (!refereeImg) return null;

                const interval = 120;
                let isSpeaking = true;
                refereeImg.src = speakingSrc;

                const animationInterval = setInterval(() => {
                    isSpeaking = !isSpeaking;
                    refereeImg.src = isSpeaking ? speakingSrc : originalSrc;
                }, interval);

                return animationInterval;
            }

            function contestantSpeaking() {
                const contestantImg = document.getElementById('contestant2-img');
                const originalSrc = '/forbiddenwords/contestant2.png';
                const speakingSrc = '/forbiddenwords/contestant2_openmouth.png';

                if (!contestantImg) return null;

                setTimeout(() => {
                    // Open mouth
                contestantImg.src = speakingSrc;
                }, 100);

                setTimeout(() => {
                    // Close mouth
                    contestantImg.src = originalSrc;
                }, 300);
            }

    </script>

</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen p-4">
    <img id="referee-img" src="/forbiddenwords/referee.png" class="hidden absolute left-8 top-1/2 -translate-y-1/2 h-96">
    <div id="contestant-container" class="hidden absolute right-8 top-1/2 -translate-y-1/2 h-96">
        <img id="contestant2-img" src="/forbiddenwords/contestant2.png" class="h-full">
        <div id="misses-container" class="absolute top-1/2 right-full flex flex-col space-y-2">
            <!-- Red crosses will be added here -->
        </div>
    </div>
    <div class="w-full max-w-2xl mx-auto text-center">
        
        <header class="mb-8">
            <h1 id="main-title" class="text-4xl md:text-5xl font-bold text-cyan-400"></h1>
            <p id="main-subtitle" class="text-slate-400 mt-2"></p>
        </header>

        <main id="game-container" class="bg-slate-800 rounded-2xl shadow-2xl p-6 md:p-8 relative">
            
            <!-- Initial State / Game Over State -->
            <div id="start-screen">
                <h2 id="game-message" class="text-3xl font-bold mb-4 text-white"></h2>
                <p id="message-subtitle" class="text-slate-300 mb-6"></p>
                <div id="language-buttons" class="flex justify-center space-x-4">
                    <button id="start-en-button" class="bg-cyan-500 hover:bg-cyan-600 text-white font-bold py-3 px-8 rounded-lg text-xl shadow-lg transition-transform transform hover:scale-105">
                        English
                    </button>
                    <button id="start-fr-button" class="bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-8 rounded-lg text-xl shadow-lg transition-transform transform hover:scale-105">
                        Français
                    </button>
                </div>
                <label class="mt-5 inline-flex items-center space-x-2 text-sm text-slate-400 cursor-pointer select-none">
                    <input id="headphones-mode" type="checkbox" class="rounded bg-slate-700 border-slate-600 text-cyan-500 focus:ring-cyan-500">
                    <span id="headphones-mode-label">Headphones mode (disable echo cancellation)</span>
                </label>
            </div>
            
            <!-- Active Game State -->
            <div id="game-screen" class="hidden">
                <!-- Main Word Display -->
                <div id="main-word-container" class="mb-6 h-64 flex items-center justify-center">
                    <!-- This will be populated by JS -->
                </div>
                
                <!-- Timer and Mic Status -->
                <div class="flex items-center justify-center space-x-4 mb-6">
                    <div id="timer" class="text-5xl font-bold text-cyan-400">30</div>
                    <div id="mic-status" class="w-12 h-12 bg-slate-700 rounded-full flex items-center justify-center transition-colors">
                        <svg class="w-6 h-6 text-slate-400" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M7 4a3 3 0 016 0v6a3 3 0 11-6 0V4zM3 8a1 1 0 011-1h1a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1V8zM13 8a1 1 0 011-1h1a1 1 0 011 1v2a1 1 0 01-1 1h-1a1 1 0 01-1-1V8z"></path>
                        </svg>
                    </div>
                </div>

                <!-- Proscribed Words List -->
                <div>
                    <h3 id="dont-say-these-words" class="text-xl font-semibold mb-3 text-slate-300"></h3>
                    <div id="forbidden-words-list" class="flex flex-wrap justify-center gap-2">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>
        </main>
        
        <footer class="mt-8 text-slate-500">
            <p id="microphone-usage"></p>
        </footer>

    </div>

    <script>
        let currentLanguage = 'en'; // Default language

        const phrases = {
            en: {
                gameTitle: "Proscribed Words Game",
                title: "Verboten",
                subtitle: "Describe the main word without saying any of the proscribed words!",
                readyToPlay: "Ready to Play?",
                clickToStart: "Click a button to start the game.",
                describeWord: (word) => `Describe the word: ${word}`,
                forbiddenWordsAre: "The proscribed words are",
                youSurvived: "You survived! Well done!",
                youWin: "You Win! 🎉",
                gameOver: "Game Over! 😥",
                playAgain: "Play Again",
                micRequired: "Microphone access is required to play. Please allow it and try again.",
                youSaidForbidden: (word) => `You said the forbidden word "${word}".`,
                youSaidTooClose: (spoken, forbidden) => `You said the word "${spoken}", which is too close to the forbidden word "${forbidden}".`,
                youSaidTranslation: (spoken, forbidden) => `You said the word "${spoken}", which is a translation of the target word "${forbidden}".`,
                modelGuessedWord: (word) => `The model guessed the word: "${word}"`,
                goodJob: "Good job!",
                microphoneUsage: "This game uses your microphone.",
                dontSayTheseWords: "Don't say these words:",
                headphonesMode: "Headphones mode (disable echo cancellation)"
            },
            fr: {
                gameTitle: "Mots Prohibés",
                title: "Verboten",
                subtitle: "Décrivez le mot secret sans prononcer aucun des mots prohibés !",
                readyToPlay: "Prêt à jouer ?",
                clickToStart: "Cliquez sur un bouton pour commencer le jeu.",
                describeWord: (word) => `Décrivez le mot : ${word}`,
                forbiddenWordsAre: "Les mots prohibés sont",
                youSurvived: "Vous avez survécu ! Bien joué ! ",
                youWin: "Vous avez gagné ! 🎉",
                gameOver: "Partie terminée ! 😥",
                playAgain: "Rejouer",
                micRequired: "L'accès au microphone est requis pour jouer. Veuillez l'autoriser et réessayer.",
                youSaidForbidden: (word) => `Vous avez dit le mot prohibé « ${word} ».`,
                youSaidTooClose: (spoken, forbidden) => `Vous avez dit le mot « ${spoken} », qui est trop proche du mot prohibé « ${forbidden} ».`,
                youSaidTranslation: (spoken, forbidden) => `Vous avez dit le mot « ${spoken} », qui est une traduction du mot à deviner « ${forbidden} ».`,
                modelGuessedWord: (word) => `Le modèle a deviné le mot: "${word}"`,
                goodJob: "Bravo !",
                microphoneUsage: "Ce jeu utilise votre microphone.",
                dontSayTheseWords: "Ne dites pas ces mots :",
                headphonesMode: "Mode casque (désactiver l'annulation d'écho)"
            },

            es: {
                readyToPlay: "¿Listo para jugar?",
                clickToStart: "Haz clic en un botón para iniciar el juego.",
                describeWord: (word) => `Describe la palabra: ${word}`,
                forbiddenWordsAre: "Las palabras prohibidas son",
                youSurvived: "¡Sobreviviste! ¡Bien hecho!",
                youWin: "¡Ganaste! 🎉",
                gameOver: "¡Juego terminado! 😥",
                playAgain: "Jugar de nuevo",
                micRequired: "Se requiere acceso al micrófono para jugar. Por favor, permítelo e inténtalo de nuevo."
            },
            de: {
                readyToPlay: "Bereit zu spielen?",
                clickToStart: "Klicken Sie auf eine Schaltfläche, um das Spiel zu starten.",
                describeWord: (word) => `Beschreiben Sie das Wort: ${word}`,
                forbiddenWordsAre: "Die verbotenen Wörter sind",
                youSurvived: "Du hast überlebt! Gut gemacht!",
                youWin: "Du hast gewonnen! 🎉",
                gameOver: "Spiel vorbei! 😥",
                playAgain: "Nochmal spielen",
                micRequired: "Mikrofonzugriff ist zum Spielen erforderlich. Bitte erlauben Sie ihn und versuchen Sie es erneut."
            }
        };

        const startScreen = document.getElementById('start-screen');
        const gameScreen = document.getElementById('game-screen');
        const gameMessage = document.getElementById('game-message');
        const messageSubtitle = document.getElementById('message-subtitle');
        const mainWordContainer = document.getElementById('main-word-container');
        const forbiddenWordsList = document.getElementById('forbidden-words-list');
        const timerDisplay = document.getElementById('timer');
        const micStatus = document.getElementById('mic-status');
        const refereeImg = document.getElementById('referee-img');

        function updateUIText(language) {
            document.documentElement.lang = language;
            document.title = phrases[language].gameTitle;
            document.getElementById('main-title').textContent = phrases[language].title;
            document.getElementById('main-subtitle').textContent = phrases[language].subtitle;
            gameMessage.textContent = phrases[language].readyToPlay;
            messageSubtitle.textContent = phrases[language].clickToStart;
            document.getElementById('microphone-usage').textContent = phrases[language].microphoneUsage;
            document.getElementById('dont-say-these-words').textContent = phrases[language].dontSayTheseWords;
            const headphonesLabel = document.getElementById('headphones-mode-label');
            if (headphonesLabel && phrases[language].headphonesMode) {
                headphonesLabel.textContent = phrases[language].headphonesMode;
            }
        }

        // Set initial text based on default language
        updateUIText(currentLanguage);

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;

        let wordData = {};
        fetch('words.json')
            .then(response => response.json())
            .then(data => wordData = data)
            .catch(error => console.error('Error loading word data:', error));

        let targetWord = {};
        let allForbiddenWords = [];
        let timer;
        let timeLeft;
        let preludeFinished = false;

        let availableVoices = [];
        let voices = {}; // Use an object to store voices per language

        function loadVoices() {
            availableVoices = window.speechSynthesis.getVoices();

            voices.en = availableVoices.find(v =>
                v.lang.startsWith('en') &&
                (v.name.toLowerCase().includes('male') ||
                 v.name.toLowerCase().includes('david') ||
                 v.name.toLowerCase().includes('daniel') ||
                 v.name.toLowerCase().includes('fred'))
            );
            if (!voices.en) {
                voices.en = availableVoices.find(v => v.lang.startsWith('en') && v.name.toLowerCase().includes('male'));
            }
            if (!voices.en) {
                voices.en = availableVoices.find(v => v.lang.startsWith('en'));
            }


            voices.fr = availableVoices.find(v =>
                v.lang.startsWith('fr') &&
                (v.name.toLowerCase().includes('male') ||
                 v.name.toLowerCase().includes('thomas') ||
                 v.name.toLowerCase().includes('amethyste'))
            );
            if (!voices.fr) {
                voices.fr = availableVoices.find(v => v.lang.startsWith('fr') && v.name.toLowerCase().includes('male'));
            }
            if (!voices.fr) {
                voices.fr = availableVoices.find(v => v.lang.startsWith('fr'));
            }


        }
        loadVoices();
        if (window.speechSynthesis.onvoiceschanged !== undefined) {
            window.speechSynthesis.onvoiceschanged = loadVoices;
        }

        function browserSpeechFallback(text, waving) {
            return new Promise((resolve) => {
                if (!window.speechSynthesis) {
                    resolve();
                    return;
                }
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = currentLanguage === 'fr' ? 'fr-FR' : 'en-US';
                utterance.rate = 1.2;

                const voice = voices[currentLanguage];
                if (voice) {
                    utterance.voice = voice;
                } else {
                    utterance.pitch = 0.3;
                }

                const animationInterval = refereeSpeaking(waving);
                activeRefereeAnim = animationInterval;

                const finish = () => {
                    if (activeRefereeAnim === animationInterval) {
                        clearInterval(animationInterval);
                        activeRefereeAnim = null;
                    }
                    const refereeImg = document.getElementById('referee-img');
                    if (refereeImg) {
                        refereeImg.src = waving ? '/forbiddenwords/referee_waves.png' : '/forbiddenwords/referee.png';
                    }
                    resolve();
                };
                utterance.onend = finish;
                utterance.onerror = finish;
                speechSynthesis.speak(utterance);
            });
        }

        async function refereeSpeak(text, waving, callback, prebuiltAudio = null) {
            console.log(text);
            let played = false;
            try {
                let clip = null;
                if (prebuiltAudio && prebuiltAudio.data) {
                    clip = {
                        bytes: b64ToUint8Array(prebuiltAudio.data),
                        mimeType: prebuiltAudio.mimeType || 'audio/wav'
                    };
                } else if (prebuiltAudio && prebuiltAudio.bytes) {
                    clip = prebuiltAudio;
                } else {
                    clip = await fetchRefereeTTS(text, currentLanguage);
                }

                if (clip && clip.bytes && clip.bytes.byteLength > 0) {
                    await playRefereeAudioBytes(clip.bytes, clip.mimeType, waving);
                    played = true;
                }
            } catch (err) {
                console.warn('Gemini TTS playback failed, falling back to browser speech:', err);
            }

            if (!played) {
                await browserSpeechFallback(text, waving);
            }
            if (callback) {
                callback();
            }
        }


        

        function normalizeWord(s) {
            return (s || '')
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .trim()
                .toLowerCase();
        }

        function formatJudgeLossMessage(spokenWord, forbiddenWord, reason) {
            const langPhrases = phrases[currentLanguage] || phrases.en;
            if (!spokenWord || !forbiddenWord) {
                return langPhrases.youSaidForbidden(forbiddenWord || spokenWord || '');
            }
            if (reason === 'translation' && langPhrases.youSaidTranslation) {
                return langPhrases.youSaidTranslation(spokenWord, forbiddenWord);
            }
            if (reason === 'exact' || normalizeWord(spokenWord) === normalizeWord(forbiddenWord) || !langPhrases.youSaidTooClose) {
                return langPhrases.youSaidForbidden(forbiddenWord);
            }
            return langPhrases.youSaidTooClose(spokenWord, forbiddenWord);
        }

        function startGame(language) {
            updateUIText(language);
            currentLanguage = language;
            humanSpeech = '';
            modelSpeech = '';
            gameEnded = false;
            if (winTimeout) {
                clearTimeout(winTimeout);
                winTimeout = null;
            }
            if (preludeTimer) {
                clearTimeout(preludeTimer);
                preludeTimer = null;
            }
            preludeFinished = false;
            startScreen.classList.add('hidden');
            mainWordContainer.innerHTML = '';
            forbiddenWordsList.innerHTML = '';
            gameScreen.classList.remove('hidden');
            refereeImg.classList.remove('hidden');
            document.getElementById('contestant-container').classList.remove('hidden');

            const gameData = { ...wordData[language][Math.floor(Math.random() * wordData[language].length)] };
            targetWord = { word: gameData.word, id: gameData.id };
            allForbiddenWords = [gameData.word, ...gameData.forbidden];

            // Display main word
            const imageUrl = `/forbiddenwords/words_img/${targetWord.id}.png`;
            mainWordContainer.innerHTML = `
                <div class="animate-grow w-full">
                    <img src="${imageUrl}" alt="${targetWord.word}" class="rounded-lg shadow-lg mx-auto mb-4 w-64 h-32 object-contain">
                    <h2 class="text-4xl font-bold">${targetWord.word}</h2>
                </div>
            `;

            recordStart();
            // Prefetch all prelude clips concurrently from Gemini TTS so playback flows smoothly.
            const describeText = phrases[language].describeWord(targetWord.word);
            const forbiddenIntroText = phrases[language].forbiddenWordsAre;
            const describePromise = fetchRefereeTTS(describeText, language);
            const introPromise = fetchRefereeTTS(forbiddenIntroText, language);
            const wordPromises = gameData.forbidden.map((word) => fetchRefereeTTS(word, language));

            (async () => {
                const describeClip = await describePromise;
                if (gameEnded) return;
                await refereeSpeak(describeText, false, null, describeClip);
                if (gameEnded) return;

                openWs(language);
                const introClip = await introPromise;
                if (gameEnded) return;
                await refereeSpeak(forbiddenIntroText, false, null, introClip);
                if (gameEnded) return;

                for (let i = 0; i < gameData.forbidden.length; i++) {
                    if (gameEnded) return;
                    const word = gameData.forbidden[i];
                    const wordEl = document.createElement('div');
                    wordEl.className = 'bg-slate-700 text-red-400 font-semibold py-2 px-4 rounded-lg animate-grow';
                    wordEl.textContent = word;
                    forbiddenWordsList.appendChild(wordEl);

                    const wordClip = await wordPromises[i];
                    if (gameEnded) return;
                    await refereeSpeak(word, false, null, wordClip);
                }

                if (gameEnded) return;
                const contestantImg = document.getElementById('contestant2-img');
                if (contestantImg) {
                    contestantImg.classList.remove('hidden');
                }
                // Brief tail delay so the referee's final syllable doesn't leak into the mic stream.
                preludeTimer = setTimeout(() => {
                    preludeFinished = true;
                    preludeTimer = null;
                }, 250);
            })();
        }

        function startTimerAndRecognition() {
            timeLeft = 30;
            timerDisplay.textContent = timeLeft;
            if (recognition) {
                 try {
                    recognition.start();
                 } catch(e) {
                    console.error("Recognition could not be started: ", e);
                 }
            }

            timer = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = timeLeft;
                if (timeLeft <= 0) {
                    endGame(true, phrases[currentLanguage].youSurvived);
                }
            }, 1000);
        }

        function endGame(isWin, message, prebuiltAudio = null) {
            if (gameEnded) {
                return;
            }
            gameEnded = true;
            if (winTimeout) {
                clearTimeout(winTimeout);
                winTimeout = null;
            }
            if (preludeTimer) {
                clearTimeout(preludeTimer);
                preludeTimer = null;
            }
            recordStop();
            if (!isWin) {
                stopPlayback();
            }
            stopRefereePlayback();
            if (ws) {
                if (ws.readyState === WebSocket.OPEN) {
                    try {
                        ws.send(JSON.stringify({ outcome: isWin ? 'won' : 'lost' }));
                    } catch (e) {
                        console.debug('send outcome error:', e);
                    }
                }
                ws.close();
            }
            console.log(message);
            clearInterval(timer);
            if (recognition) {
                recognition.stop();
            }

            gameScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');

            gameMessage.textContent = isWin ? phrases[currentLanguage].youWin : phrases[currentLanguage].gameOver;
            messageSubtitle.textContent = message;
            
            // Referee raises his hand
            const refereeImg = document.getElementById('referee-img');
            if (refereeImg) {
                refereeImg.src = '/forbiddenwords/referee_waves_openmouth.png';
            }

            if (isWin) {
                // Won
                refereeSpeak(phrases[currentLanguage].goodJob, true, null, prebuiltAudio);
            } else {
                // Lost: play the pre-generated Gemini TTS verdict audio immediately if available
                refereeSpeak(message, true, null, prebuiltAudio);
            }

            const languageButtons = document.getElementById('language-buttons');
            languageButtons.innerHTML = ''; // Clear language buttons

            const playAgainButton = document.createElement('button');
            playAgainButton.id = 'play-again-button';
            playAgainButton.className = 'bg-cyan-500 hover:bg-cyan-600 text-white font-bold py-3 px-8 rounded-lg text-xl shadow-lg transition-transform transform hover:scale-105';
            playAgainButton.textContent = phrases[currentLanguage].playAgain;
            //playAgainButton.onclick = () => handleStartGameClick(currentLanguage);
            playAgainButton.onclick = () => location.reload(); // make sure WS gets connected anew
            languageButtons.appendChild(playAgainButton);
        }

        // --- Event Listeners ---
        const headphonesCheckbox = document.getElementById('headphones-mode');
        if (headphonesCheckbox) {
            headphonesCheckbox.checked = localStorage.getItem('verboten_headphones_mode') === 'true';
            headphonesCheckbox.addEventListener('change', () => {
                localStorage.setItem('verboten_headphones_mode', headphonesCheckbox.checked ? 'true' : 'false');
            });
        }

        function handleStartGameClick(language) {
            ensurePlaybackContext();
            unlockRefereeAudio();
            // Check for microphone permissions first
            navigator.mediaDevices.getUserMedia({ audio: getAudioConstraints() })
                .then(stream => {
                    // Permissions granted, we can close the stream immediately
                    stream.getTracks().forEach(track => track.stop());
                    startGame(language);
                })
                .catch(err => {
                    console.error('Microphone access denied:', err);
                    endGame(false, "Microphone access is required to play. Please allow it and try again.");
                });
        }

        document.getElementById('start-en-button').addEventListener('click', () => handleStartGameClick('en'));
        document.getElementById('start-fr-button').addEventListener('click', () => handleStartGameClick('fr'));


    </script>
</body>
